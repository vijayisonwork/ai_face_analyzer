name: ai_face_analyzer
description: Flutter plugin for on-device face detection using Google ML Kit with native Android implementation.
version: 1.0.0
homepage: https://github.com/vijayisonwork/ai_face_analyzer
repository: https://github.com/vijayisonwork/ai_face_analyzer
documentation: https://github.com/vijayisonwork/ai_face_analyzer
issue_tracker: https://github.com/vijayisonwork/ai_face_analyzer/issues

topics:
  - flutter
  - mlkit
  - face-detection
  - ai
  - android

environment:
  sdk: ">=3.7.2 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.vs_plugin.ai_face_analyzer
        pluginClass: AiFaceAnalyzerPlugin

screenshots:
  - description: Group Faces Detected
    path: screenshots/group_detected.jpeg

  - description: Single Face Detected
    path: screenshots/single_detected.jpeg

  - description: No Face Detected
    path: screenshots/no_face_detected.jpeg